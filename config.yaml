data:
  raw_dir: "data/raw/PlantVillage"
  processed_dir: "data/processed"
  img_size: 224
  batch_size: 32
  num_workers: 4
  val_split: 0.15
  test_split: 0.05
  seed: 42

train:
  epochs: 20
  lr: 0.0003
  weight_decay: 0.0001
  pretrained: true
  backbone: "tf_efficientnet_b0"
  device: "cuda"
  mixed_precision: true

scheduler:
  name: "reduce_on_plateau"
  mode: "max"
  factor: 0.5
  patience: 2
  min_lr: 1.0e-6

save:
  out_dir: "outputs"
  model_dir: "outputs/models"
  log_dir: "outputs/logs"
  metrics_dir: "outputs/metrics"
  save_best_as: "best_model.pth"

logging:
  print_every: 10
  wandb: false
  project: "plant-disease-detection"
